name: AutoAgent Quality Gate

on:
  push:
    branches:
      - main
      - feature/auto-agent
  pull_request:
    branches:
      - '**'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff black mypy pytest pytest-cov

      - name: Run evaluator
        run: python autoagent/evaluator.py --verbose
