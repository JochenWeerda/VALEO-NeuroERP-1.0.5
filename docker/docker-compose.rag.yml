version: "3.8"
services:
  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: valero-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    environment:
      QDRANT__SERVICE__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1g
  chroma:
    image: chromadb/chroma:latest
    container_name: valero-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ANONYMIZED_TELEMETRY: "False"
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/chroma/.chroma
    deploy:
      resources:
        limits:
          memory: 1g
volumes:
  qdrant_data: {}
  chroma_data: {}
